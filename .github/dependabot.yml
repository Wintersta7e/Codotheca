version: 2
updates:
  # Every action in both workflows is pinned to a commit, so nothing moves unless this proposes it.
  # Only the actions: npm and cargo move by hand, behind the full gate, because the toolchain is
  # upgraded deliberately rather than as it publishes.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    # A release that turns out to be compromised is usually pulled within days; a week's wait
    # means a pin never moves onto one on the day it is published.
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ['*'] }
    commit-message: { prefix: ci }
