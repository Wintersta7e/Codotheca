name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }

# A hosted runner has ~14 GB free and this workspace does not fit in it twice. Ninety-six test
# binaries carrying debug info filled the disk and the linker died with `signal 7 [Bus error]`
# at 86 MB free — a failure that names the linker and not the cause. Nothing in CI attaches a
# debugger, and a panic still names its frames.
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

# A second push to the same ref makes the first run's result irrelevant. Without this they both
# run to completion and the older one can report after the newer.
#
# **Except on `main`.** A cancelled run leaves no verdict and takes its logs with it, and two
# pushes to `main` went red for ten days with nobody the wiser. Every commit on the branch that
# ships gets a full answer of its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Nothing else in this file protects this file. `release.yml` carried a `${{ }}` expression
  # inside a YAML flow mapping — which makes `{` an indicator — and was unparseable from the day
  # it was written: GitHub reported a 0-second "workflow file issue" and ran no job at all.
  # actionlint parses every workflow, type-checks every expression, and shellchecks every
  # `run:` block, so the next one fails here instead of on a release tag.
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with: { args: -color }

  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest] }
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'rustfmt, clippy' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      # core/src/protocol.rs is generated and gitignored, so a runner that never touches Node
      # would compile against whatever the last commit happened to leave — or nothing at all.
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: generate protocol
        run: npm run gen
      # §20's keychain reaches the Secret Service over D-Bus on Linux, so `libdbus-sys` compiles
      # against system headers this image does not ship. Without it every Linux cargo invocation
      # dies in a build script — which is what took `core (ubuntu)`, `e2e` and `acceptance` red
      # from the moment accounts landed, on a machine where the headers were already installed.
      - name: room to link in
        # The runner ships toolchains this project never uses; the linker needs the space more.
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      - name: dbus development headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: fmt
        run: cargo fmt --manifest-path core/Cargo.toml -- --check
      - name: clippy
        run: cargo clippy --locked --manifest-path core/Cargo.toml --all-targets --all-features -- -D warnings
      - name: test
        # `--locked` on every cargo invocation: a Cargo.lock that no longer matches Cargo.toml
        # otherwise resolves silently on the runner and the build is not the one committed.
        run: cargo test --locked --manifest-path core/Cargo.toml --features testkit
      # §13's second binary. It only ever runs on Linux, but it must not rot between releases,
      # and the Windows packaging job cannot stage what was never built. Both architectures are
      # built: WSL2 runs on arm64 Windows too, and a target nobody compiles is one that breaks
      # silently on exactly the machines that cannot diagnose it.
      - name: build the WSL worker
        if: runner.os == 'Linux'
        # `--no-default-features` drops §20.6's keychain, which the worker does not use and which
        # reaches `libdbus-sys` on Linux: a system-header dependency with no arm64 sysroot here,
        # so the cross-build died in its build script from the day accounts landed.
        run: |
          cargo build --locked --no-default-features --manifest-path core/Cargo.toml --bin codotheca-worker
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo build --locked --no-default-features --manifest-path core/Cargo.toml \
              --bin codotheca-worker --target aarch64-unknown-linux-gnu
      - name: corpus generates on this platform
        # The fixtures whose builders differ by platform: a bare clone, a linked worktree, a
        # recursive submodule, a path git can only hold in the tree, and one over MAX_PATH.
        run: cargo run --locked --manifest-path core/Cargo.toml --features testkit --bin codotheca-corpus -- --out corpus-check --only bare,linked-worktree,submodule-parent,non-utf8-path,long-path --force

  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Windows is the primary target and the shell suite had never run there. The main-process
      # half is full of path handling, and a jsdom suite passing on Linux says nothing about it.
      matrix: { os: [ubuntu-latest, windows-latest] }
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        # Electron 44 requires >= 22.12.0 and Vite 7 requires ^20.19 || >= 22.12.
        with: { node-version: 22, cache: npm }
      # This job installs no Rust toolchain and still compiles the core: `test/corpus.test.ts`
      # shells out to `cargo run --bin codotheca-corpus`, against the cargo the image ships. So
      # it needs the same two things every other Linux job needs, and it is the reason this job
      # was red on Linux and green on Windows, where the keychain uses no D-Bus at all.
      - name: room to link in
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      - name: dbus development headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - run: npm ci
      - name: generate protocol
        run: npm run gen
      - name: protocol lock is up to date
        # app/src/generated and core/src/protocol.rs are gitignored, so the `git status` check
        # this replaced returned zero lines whatever the tree held, and passed unconditionally.
        # generated.lock is tracked, so regenerating it here fails when the schema moved without
        # `npm run gen`, and when the generator's output changed without review.
        run: git diff --exit-code -- protocol/generated.lock
      - name: protocol tests
        run: npm run test --workspace protocol
      - run: npm run typecheck
      - name: stdout discipline
        run: npm run lint:stdout
      # `npm run lint` ends in `cargo clippy` and this runner installs no Rust toolchain, so the
      # step would have failed on CI's first ever run for a reason that has nothing to do with
      # the shell. The core job already runs clippy with both flags on both platforms; this job
      # runs the shell half only rather than installing a second toolchain to repeat it.
      - name: shell lint
        run: npm run lint:shell
      - run: npm run build:app
      - name: bundle guard
        # The bundle exists where packaging expects it, names no remote origin in its HTML or
        # CSS, ships the policy, and carries the self-hosted faces.
        run: npm run check:bundle
      - run: npm run test --workspace app
      - name: formatting
        # The TypeScript half of fmt:check only. `cargo fmt --check` already runs in the core
        # job on both runners; installing a Rust toolchain here to repeat it would be a
        # second copy of a gate that is already green.
        if: runner.os == 'Linux'
        run: npx prettier --check "app/**/*.{ts,tsx}" "scripts/**/*.mjs"

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Windows is the primary target and the app had never been launched there by anything but
      # a person. Everything this suite asserts — a painted screen, the top bar's floor, a scan
      # that reaches the shelf — is geometry and paths, which is where the two platforms differ.
      matrix: { os: [ubuntu-latest, windows-latest] }
    env:
      # Playwright's own report, read by `check-e2e-skips.mjs`. A `grep` over console output
      # would tie this job to bash and is why it could only ever run on one platform.
      PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report.json
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run gen
      # mount.spec.ts calls `test.skip()` when core/target/release/codotheca-core is absent, so
      # without this the job passed in 41 seconds having asserted nothing about a painted screen.
      # The first CI run did exactly that. The binary is the test's precondition, not an extra.
      # §20's keychain reaches the Secret Service over D-Bus, so `libdbus-sys` needs the headers.
      - name: room to link in
        # The runner ships toolchains this project never uses; the linker needs the space more.
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      - name: dbus development headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: build the release core
        run: cargo build --locked --release --manifest-path core/Cargo.toml --bin codotheca-core
      - run: npm run build:app
      # Electron ships its own Chromium; only the shared libraries are missing on a runner.
      - if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      # A skip is a failure: this suite holds the only assertions in the repository about a
      # painted screen and about a scan reaching the shelf, and it degrades to green silently.
      # A gate whose passing run measures nothing is a failing gate.
      - name: end to end
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:e2e --workspace app -- --reporter=list,json
      - name: end to end
        if: runner.os == 'Windows'
        # A Windows runner has a desktop session of its own, so there is no display to start.
        run: npm run test:e2e --workspace app -- --reporter=list,json
      - name: no spec may skip
        # Always: a suite that failed **and** skipped is two defects, and the second one is the
        # quiet one. Playwright exits zero over a skipped spec, which is how a green run can
        # assert nothing at all.
        if: always()
        run: node scripts/check-e2e-skips.mjs
      # The pixel test writes both frames it compares into its output directory. Byte counts
      # alone cannot tell "the app drew nothing" from "the capture returned an uncomposited
      # surface", and the two have opposite fixes — on a runner the images are the only evidence.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-frames
          path: app/test-results/**
          retention-days: 7
          if-no-files-found: warn

  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - run: npm ci
      - run: npm run gen
      - run: npm run build:app
      # §20's keychain reaches the Secret Service over D-Bus, so `libdbus-sys` needs the headers.
      - name: room to link in
        # The runner ships toolchains this project never uses; the linker needs the space more.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      - name: dbus development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      # The static gates and the suites write here; the gate reads the directory. It must exist
      # before the first writer or every gate reports its result into nothing.
      - name: results directory
        run: mkdir -p acceptance/results
      - name: harness unit tests
        run: npm run test:harness
      - name: the committed disposition table is in sync
        run: npm run acceptance -- --dispositions && git diff --exit-code -- acceptance/DISPOSITIONS.md
      - name: static gates
        run: npm run check:forbidden && npm run check:callsites && npm run check:problems
      - name: core suite
        # `pipefail` is not the default for a `run:` block, and without it `tee` returns zero for
        # a red suite: this repository has already shipped one gate that could not fail.
        # `2>&1` is load-bearing: cargo prints `Running tests/<name>.rs` to **stderr** while libtest
        # prints `test <bare name> ... ok` to stdout. Piping stdout alone gave the harness no binary
        # for any integration test, so eight criteria read as "did not run" beside seven results as
        # "no check claims it" — the same tests, seen from either side.
        run: |
          set -o pipefail
          cargo test --locked --manifest-path core/Cargo.toml --features testkit -- --nocapture \
            2>&1 | tee acceptance/results/cargo.txt
      - name: app suite
        run: npm run test --workspace app -- --reporter=json --outputFile=../acceptance/results/vitest.json
      - name: gate
        # Always, so a red suite still produces the report that names *which* checks failed.
        # Deliberately no performance measurement: a hosted runner is neither reference machine
        # and a budget checked on unknown hardware is a number nobody can act on.
        if: always()
        run: npm run acceptance
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: acceptance-report, path: acceptance/report.md }

  # Two ecosystems, two lockfiles, one question: is anything we ship known to be vulnerable?
  # The toolchain was replaced once because the pinned set carried twenty advisories, and
  # nothing since then has asked again.
  advisories:
    name: advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: cargo advisories
        # The lockfile, not the manifest: what resolves is what ships.
        run: |
          cargo install cargo-audit --locked
          cargo audit --file core/Cargo.lock
      - name: npm advisories
        # Production dependencies only. A dev-tree advisory does not reach a user's machine, and
        # a gate that goes red for one teaches everyone to ignore a red gate.
        run: npm audit --omit=dev --audit-level=high

  # One check that means "everything passed", because a job can fail, be skipped or be
  # cancelled, and a reader who glances at a run sees a green tick beside the jobs that did
  # succeed. Two pushes to `main` sat red for ten days behind exactly that.
  all-green:
    name: all green
    if: always()
    needs: [workflows, core, app, e2e, acceptance, advisories]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Through the environment rather than inlined into the script: `run:` is a shell, and a
      # value interpolated into one is a value that can end a quote.
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: every job succeeded
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a job did not succeed: $result"
              exit 1
            fi
          done
          echo "all jobs succeeded"

