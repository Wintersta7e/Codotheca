name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest] }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - name: fmt
        run: cargo fmt --manifest-path core/Cargo.toml -- --check
      - name: clippy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path core/Cargo.toml

  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # Electron 44 requires >= 22.12.0 and Vite 7 requires ^20.19 || >= 22.12.
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: generate protocol
        run: npm run gen
      - name: protocol is committed in sync
        # The generator is the source of truth. If regenerating changes anything that is
        # tracked, someone edited generated code by hand.
        run: git status --porcelain -- app/src/generated core/src/protocol.rs | tee /dev/stderr | wc -l | grep -qx 0
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:app
      - name: bundle guard
        # The bundle exists where packaging expects it, names no remote origin in its HTML or
        # CSS, ships the policy, and carries the self-hosted faces.
        run: npm run check:bundle
      - run: npm run test --workspace app
      - name: formatting
        # The TypeScript half of fmt:check only. `cargo fmt --check` already runs in the core
        # job on both runners; installing a Rust toolchain here to repeat it would be a
        # second copy of a gate that is already green.
        run: npx prettier --check "app/**/*.{ts,tsx}" "scripts/**/*.mjs"
