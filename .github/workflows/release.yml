name: Release
on:
  workflow_dispatch:
  push: { tags: ['v*'] }
permissions: { contents: read }

# A tag push and a re-run of the same tag must not race for the same artifact names.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest] }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        # `package.json` declares engines.node ">=22.12.0". Pinning 20 here made the release
        # build the one place in the project running below its own floor.
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run gen
      - run: npm run build:core
      - run: npm run build:app
      # NOTE: Windows code signing needs a certificate and a hardware token or a cloud signer.
      # That is procurement with weeks of lead time, not a build flag. See the packaging spec §14.
      # Until it exists, Windows artifacts are unsigned and SmartScreen will warn.
      - name: package
        run: npx electron-builder --publish never
        # Quoted: a `${{ }}` expression inside a YAML flow mapping makes the `{` an indicator and
        # the file unparseable. This workflow never ran once before that was fixed.
        env:
          CODOTHECA_CHANNEL: "${{ matrix.os == 'ubuntu-latest' && 'appimage' || 'nsis' }}"

      # `electron-builder.yml` sets `directories.output: dist`. The old `out/*` matched nothing,
      # so a green release job would have published an empty artifact.
      - name: the packaged artifacts exist
        shell: bash
        run: |
          count=$(find dist -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) | wc -l)
          echo "packaged artifacts: $count"
          test "$count" -gt 0 || { echo 'no artifact was produced'; ls -la dist || true; exit 1; }

      - uses: actions/upload-artifact@v5
        with:
          name: 'codotheca-${{ matrix.os }}'
          path: dist/*
          retention-days: 14
          if-no-files-found: error
