name: Release
on:
  workflow_dispatch:
  push: { tags: ['v*'] }
permissions: { contents: read }

# A tag push and a re-run of the same tag must not race for the same artifact names.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # §13: the Windows installer carries a Linux worker per architecture, for repositories that live
  # inside WSL. `build/worker/` is gitignored, so on a fresh checkout nothing is staged there and
  # the pack would ship without one; it is built here and handed to the Windows pack instead.
  worker:
    name: wsl worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { toolchain: stable }
      # The same two builds as `ci.yml`'s worker step, in release mode. `--no-default-features`
      # drops §20.6's keychain: the worker stores no credentials, and the keychain's Linux backend
      # is a system-header dependency with no arm64 sysroot on this image.
      - name: build for x64 and arm64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
          cargo build --release --locked --no-default-features --manifest-path core/Cargo.toml \
            --bin codotheca-worker
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo build --release --locked --no-default-features --manifest-path core/Cargo.toml \
              --bin codotheca-worker --target aarch64-unknown-linux-gnu
          mkdir -p worker/linux-x64 worker/linux-arm64
          cp core/target/release/codotheca-worker worker/linux-x64/
          cp core/target/aarch64-unknown-linux-gnu/release/codotheca-worker worker/linux-arm64/
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: wsl-worker
          path: worker/
          retention-days: 1
          if-no-files-found: error

  build:
    name: package (${{ matrix.os }})
    needs: worker
    # `id-token` signs the provenance below and `attestations` stores it; nothing else writes.
    permissions: { contents: read, id-token: write, attestations: write }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest] }
    steps:
      # No caches anywhere in this file. A cache is written by whatever ran last on the branch, so
      # a release restored from one ships what that run left behind; this build starts cold.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { toolchain: stable }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        # `package.json` declares engines.node ">=22.12.0". Pinning 20 here made the release
        # build the one place in the project running below its own floor.
        with: { node-version: 22, package-manager-cache: false }
      - run: npm ci
      - run: npm run gen
      # §20's keychain reaches the Secret Service over D-Bus on Linux, so `libdbus-sys` compiles
      # against system headers this image does not ship. The same step is in every Linux job of
      # `ci.yml`; without it the packaged Linux build dies in a build script before it starts.
      - name: dbus development headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - run: npm run build:core
      - run: npm run build:app
      - name: fetch the WSL worker
        if: runner.os == 'Windows'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with: { name: wsl-worker, path: worker }
      # The script validates each ELF header and derives the architecture from it, so a swapped
      # or truncated artifact fails here instead of shipping an installer that cannot reach WSL.
      - name: stage the WSL worker
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node scripts/stage-worker.mjs --from worker/linux-x64/codotheca-worker
          node scripts/stage-worker.mjs --from worker/linux-arm64/codotheca-worker
      # NOTE: Windows code signing needs a certificate and a hardware token or a cloud signer.
      # That is procurement with weeks of lead time, not a build flag. See the packaging spec §14.
      # Until it exists, Windows artifacts are unsigned and SmartScreen will warn.
      - name: package
        run: npx electron-builder --publish never
        # Quoted: a `${{ }}` expression inside a YAML flow mapping makes the `{` an indicator and
        # the file unparseable. This workflow never ran once before that was fixed.
        env:
          CODOTHECA_CHANNEL: "${{ matrix.os == 'ubuntu-latest' && 'appimage' || 'nsis' }}"

      # `electron-builder.yml` sets `directories.output: dist`. The old `out/*` matched nothing,
      # so a green release job would have published an empty artifact.
      - name: the packaged artifacts exist
        shell: bash
        run: |
          count=$(find dist -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) | wc -l)
          echo "packaged artifacts: $count"
          test "$count" -gt 0 || { echo 'no artifact was produced'; ls -la dist || true; exit 1; }
      # An `extraResources` filter that matches nothing packs nothing and says so nowhere.
      - name: the Windows pack carries both workers
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for arch in x64 arm64; do
            test -s "dist/win-unpacked/resources/worker/linux-$arch/codotheca-worker" \
              || { echo "no linux-$arch worker in the pack"; exit 1; }
          done

      # Signed provenance: which workflow, at which commit, produced each file. It is not a
      # code-signing certificate and SmartScreen still warns, but anyone can check a download with
      # `gh attestation verify <file> --repo <owner>/<repo>`. GitHub offers it to public
      # repositories only, so a private run skips it rather than failing the release.
      - name: attest the Windows artifacts
        if: runner.os == 'Windows' && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: 'dist/*.exe' }
      - name: attest the Linux artifacts
        if: runner.os == 'Linux' && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: 'codotheca-${{ matrix.os }}'
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  # A tag becomes a DRAFT release: the installers, their checksums, and notes generated from the
  # commits since the previous tag. Publishing it stays a person's decision, on the release page.
  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with: { pattern: 'codotheca-*', path: dist, merge-multiple: true }
      # GitHub renames a release asset's spaces to dots, so the files are renamed first and the
      # checksums name exactly what a user downloads. The attestations are by digest and do not
      # care what the file is called.
      - name: checksums and the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          find . -maxdepth 1 -type f -name '* *' -print0 |
            while IFS= read -r -d '' f; do mv -- "$f" "${f// /.}"; done
          mapfile -d '' files < <(find . -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -printf '%P\0' | sort -z)
          test "${#files[@]}" -gt 0 || { echo 'no artifact to release'; exit 1; }
          sha256sum -- "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" --draft --verify-tag --generate-notes --title "$TAG" \
            -- "${files[@]}" SHA256SUMS
