[package]
name = "codotheca-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"
description = "Codotheca core: scanning, git, index and art rasterisation"
# Shipped inside the app, never to a registry.
publish = false

[lib]
name = "codotheca_core"
path = "src/lib.rs"

[[bin]]
name = "codotheca-core"
path = "src/main.rs"

# The corpus generator. `required-features` keeps it out of a default release build; the file
# is a placeholder until plan 06 Task 12 fills it, because `--all-features` clippy builds every
# declared target and a missing path is a hard error.
[[bin]]
name = "codotheca-corpus"
path = "src/bin/corpus.rs"
required-features = ["testkit"]

# §24.2a's recording stand-in for `git`. A declared binary rather than a script because Windows
# `CreateProcess` will not spawn a shebang file, and because the write audit must read the argv
# and environment the child ACTUALLY received — R88: an assertion over the argv a builder returns
# is an assertion about an intention, and between that builder and the child sit `write_base_args`
# and the `Command` builder. Testkit-only, so no release build contains it.
[[bin]]
name = "codotheca-recording-git"
path = "src/bin/recording_git.rs"
required-features = ["testkit"]

# §13: the WSL worker. One per supported architecture, built alongside the Windows core and
# shipped inside the Windows installer (plan 19 stages it).
[[bin]]
name = "codotheca-worker"
path = "src/bin/worker.rs"

[features]
default = ["keychain"]
# §20.6's OS keychain. Optional so §13's WSL worker — the same crate, a different binary — can be
# built without `keyring`, whose Linux backend is `libdbus-sys`: a system-header dependency that
# cannot cross-compile to aarch64 without a sysroot, for a helper that stores no credentials.
keychain = ["dep:keyring"]
# Test doubles and the corpus generator. Off by default so the shipped binary contains no
# fake clock, no fake mount table and no fixture builder.
#
# `TempIndex` puts a migrated database in a temporary directory, so the seam needs `tempfile` as
# a real dependency rather than a dev one — `core::testing` is a library module, not a test.
# `rusqlite/trace` is testkit-only: it installs a per-connection statement callback, which is
# how `commands_session.rs` proves `session.focus` issues no statement at all. A release build
# has neither the hook nor the callback.
testkit = ["dep:tempfile", "rusqlite/trace"]

[dependencies]
# §29.3's three-marker pass over raw blob bytes. **Promoted, not added**: `ignore` → `globset`
# already pins this exact version transitively, so a direct entry brings zero new crates to
# either target — verified by comparing `cargo metadata` package counts either side of the edit.
aho-corasick = "1.1.5"
base64 = "0.22"
# The machine's local UTC offset, and nothing else. §8.1's era bands cut on the local calendar
# year, so the offset is a correctness input: a wrong one mis-sorts the shelf silently instead
# of failing. std has no timezone support, and the platform calls that do (`localtime_r`,
# `GetTimeZoneInformation`) need `unsafe`, which this crate forbids. `time`'s local-offset read
# is documented-unsound in a multithreaded process and returns `None` there, which this is.
# Default features off: only the `clock` feature is used, never chrono's formatting or serde.
# Three crates compile per target — chrono + num-traits + iana-time-zone on Linux, and
# chrono + num-traits + windows-link on Windows. The wasm-bindgen and futures entries this
# adds to Cargo.lock are wasm32-only and are never built for either target.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Spawns every git child into a Linux process group or a Windows Job Object, so a kill takes
# the whole tree. A plain kill left eight live git processes holding file locks (§3.4).
command-group = "5"
# Cross-platform advisory file locks with no libc and no unsafe in our tree. std's own
# File::try_lock is stable only from 1.89 and the workspace MSRV is 1.80.
fs4 = "1.1"
# The parallel directory walk (J0). Standard filters off: this is a filesystem census, not a
# git operation, so nothing may be hidden by a `.gitignore`.
ignore = "0.4"
# §20.6's OS keychain: Credential Manager on Windows, Secret Service on Linux. The database
# stores `token_ref` and never a token.
#
# `sync-secret-service`, not the async one: every subsystem in this core is blocking threads and
# the async backend would need an executor of ours. `crypto-rust` keeps the session encryption
# pure Rust, so there is no OpenSSL to build for two targets — the doctrine this file already
# states for `image-webp` and `tiny-skia`.
#
# NOT keyring 4.x: its `rust-version` is 1.88.0 against this package's 1.80. Adopting it is a
# workspace MSRV decision, not an accounts decision.
keyring = { version = "3.6.3", optional = true, default-features = false, features = [
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
# §7.2's lossless WebP encoder. Pure Rust, so there is no C dependency to build for two
# targets and no `unsafe` to justify against this crate's own `forbid`.
image-webp = "0.2"
# §6's bounded worktree watch set. Change notification only — path names, never file contents.
# Default features off: the macOS FSEvents backend is the only optional one this needs and the
# targets are Windows and Linux, which use ReadDirectoryChangesW and inotify unconditionally.
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }
# The one HTTP client in the product (R66). Blocking, because every subsystem in this core is
# blocking threads. `reqwest`'s blocking client is implemented over its async one and starts a
# background tokio runtime — so tokio IS in the tree; what is NOT in the tree is any async code
# of ours, which the gate in core/tests/http_transport.rs asserts over every file in core/src/.
# rustls rather than native-tls: no OpenSSL to build for two targets, and no system library to
# version-skew.
reqwest = { version = "0.12.24", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "gzip",
    "json",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# R5: the ref-state basis is a lowercase-hex SHA-256, because `location.refstate_basis` is TEXT.
sha2 = "0.10"
# Only under `testkit`; see the feature's comment.
tempfile = { version = "3", optional = true }
thiserror = "2"
# §7's rasterizer. CPU-only 2D, no GPU context and no system library.
tiny-skia = "0.12"
# §24.7F's Recycle Bin / XDG trash, behind `removal::SystemTrash`. This crate forbids `unsafe`,
# and a real Recycle Bin send is `IFileOperation` — so on the primary target there is no
# hand-written honest implementation, only a dependency or a permanent refusal. §24.7F requires
# the failure cases be "detected and stated plainly rather than silently falling back", which a
# stub cannot do.
#
# PINNED EXACTLY, and not a caret: `5.2.9` raises its `rust-version` to 1.85 against this
# package's 1.80, so `^5.2.3` silently locks a version this crate does not claim to support.
# Lifting the pin is a workspace MSRV decision, not a removal decision — the same rule that
# kept `keyring` at 3.x. New crates for the two shipped targets are `scopeguard` and
# `urlencoding` only; `chrono`, `libc`, `log` and `once_cell` were already in the graph, and
# the `objc2*` entries this adds to Cargo.lock are macOS-only and are never built for either.
trash = "=5.2.3"

# §4.3's cycle and duplicate detection needs a directory's stable file identity. On Windows that
# is `(volume serial, file index)` from an open handle; `std::os::windows::fs::MetadataExt`
# exposes both but only on nightly, behind `windows_by_handle`, and this crate forbids `unsafe`.
[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"
# §4bis.1's registry sources: the App Paths keys under both hives, and the default shell verb for
# a folder. Read-only, and behind `#[cfg(windows)]` at every call site — the two Shell Link
# parsers beside them are platform-free and are tested on Linux too.
winreg = "0.56"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
# A `pub` no external path can reach is a false statement about the API.
unreachable_pub = "deny"
unused_qualifications = "deny"
elided_lifetimes_in_paths = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_lifetimes = "deny"
single_use_lifetimes = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
# A homoglyph identifier is a supply-chain shape.
non_ascii_idents = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Denied deliberately: these are the ones that bite in a process that shells out to git
# and writes to a database, and none of them should ever be silenced without a comment.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
indexing_slicing = "deny"
unwrap_in_result = "deny"
# stdout carries protocol frames and nothing else. `print_stderr` is deliberately NOT denied:
# stderr is the diagnostics channel the shell drains.
print_stdout = "deny"
dbg_macro = "deny"
# The core is a supervised child: the shell decides when it ends, not the core.
exit = "deny"
mem_forget = "deny"
# `as` truncates and wraps silently, and a byte count or a timestamp is where that hides.
as_conversions = "deny"
# Floats stay out of counts, sizes and times; the rasteriser opts in at its module root.
float_arithmetic = "deny"
# Slicing a str by byte index panics on a UTF-8 boundary, and paths and names here are user text.
string_slice = "deny"
shadow_unrelated = "deny"
str_to_string = "deny"
verbose_file_reads = "deny"
rc_buffer = "deny"
same_name_method = "deny"
try_err = "deny"
unneeded_field_pattern = "deny"
if_then_some_else_none = "deny"
empty_structs_with_brackets = "deny"
format_push_string = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
# Allowed with reasons, not by taste:
module_name_repetitions = "allow"   # core::scan::ScanError reads better than core::scan::Error
# Every duplicate is transitive (windows-sys alone arrives in five versions); collapsing them is
# a dependency-upgrade decision, not something a lint can settle.
multiple_crate_versions = "allow"
# Contradicts rustc's `unreachable_pub` on any item of a private module its parent uses: `pub`
# fires one, `pub(crate)` the other. `unreachable_pub` is the check kept.
redundant_pub_crate = "allow"

[profile.release]
opt-level = 2
lto = "thin"
strip = true

# Slim debug info, and it is load-bearing rather than a tuning knob.
#
# Full debug info made each test binary ~173 MB; a target directory reached 83 GB across 4,462
# files in `debug/deps` and a single suite run added tens of GB. `line-tables-only` keeps
# `debug_assertions` and overflow checks on — `--release` does not, so it is no substitute — and
# keeps every panic backtrace's file and line, which is all these suites read.
#
# On Windows it is the difference between a build and a quarantine: a resident scanner's
# heuristic emulator deleted a freshly linked test binary that shipped a 120,877,056-byte `.pdb`,
# and cargo reported `os error 2`, then `5`, then `32` on a binary it had just written. The
# answer is to stop emitting what tripped it, never an antivirus exclusion — the scanner is right
# to watch the tree.
[profile.test]
debug = "line-tables-only"
