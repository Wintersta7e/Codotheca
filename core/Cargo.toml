[package]
name = "codotheca-core"
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"
description = "Codotheca core: scanning, git, index and art rasterisation"

[lib]
name = "codotheca_core"
path = "src/lib.rs"

[[bin]]
name = "codotheca-core"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
# Cross-platform advisory file locks with no libc and no unsafe in our tree. std's own
# File::try_lock is stable only from 1.89 and the workspace MSRV is 1.80.
fs4 = "1.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Denied deliberately: these are the ones that bite in a process that shells out to git
# and writes to a database, and none of them should ever be silenced without a comment.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
indexing_slicing = "deny"
# stdout carries protocol frames and nothing else. `print_stderr` is deliberately NOT denied:
# stderr is the diagnostics channel the shell drains.
print_stdout = "deny"
dbg_macro = "deny"
# Allowed with reasons, not by taste:
module_name_repetitions = "allow"   # core::scan::ScanError reads better than core::scan::Error
missing_errors_doc = "allow"        # revisit once the public surface stabilises

[profile.release]
opt-level = 2
lto = "thin"
strip = true
